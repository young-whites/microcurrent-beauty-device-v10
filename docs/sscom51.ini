;SSCOM config for DJM-V10 beauty device - V5.0 protocol
;删除此文件可以恢复默认值
;SSCOM启动时加载本文件，恢复上次保存的串口参数和数据框，不要用外部编辑器修改！
;文件格式:分号开头表示注释，每行为 key=value
;
;N=Hex数据，H前缀表示HEX数据
;N=Ascii数据，A前缀表示ASCII数据
;Nx表示发送第N个框的内容(1<x<=N)

