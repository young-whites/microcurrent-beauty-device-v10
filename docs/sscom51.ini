;SSCOM config for DJM-V10 beauty device - V5.0 protocol
;Delete this file to restore default settings
;SSCOM loads this file on startup to restore previously saved serial parameters and data fields. Do not edit externally!
;File format: semicolon prefix = comment, each line is key=value
;
;N=Hex data, H prefix means HEX data
;N=Ascii data, A prefix means ASCII data
;Nx means send the Nth field's content (1<x<=N)

